[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "official-statistic-trigger-revalidator"
version = "0.1.0"
description = "Official Statistic Trigger Revalidator Intelligent Contract and Test Suite"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "genlayer-test==0.29.2",
    "genvm-linter==0.11.0",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-config --strict-markers -p no:cacheprovider"
markers = [
    "live: Opt-in live test against official BLS API"
]

[tool.ruff]
line-length = 100
target-version = "py313"
